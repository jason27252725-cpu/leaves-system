<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>LEAVES DESIGN · Release Router</title>
    <style>
        *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#050506;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden}
        body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(64,45,90,.18),transparent 35%),#050506}
        .card{width:min(420px,calc(100vw - 36px));padding:34px 30px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(12,12,15,.78);backdrop-filter:blur(24px);box-shadow:0 28px 70px rgba(0,0,0,.5);text-align:center}
        .mark{width:46px;height:46px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:#fff;color:#050506;font-weight:800}.brand{font-size:13px;letter-spacing:.22em}.sub{font-size:10px;color:#777;margin-top:8px;letter-spacing:.1em}.bar{height:3px;background:#17171a;border-radius:999px;overflow:hidden;margin:26px 0 14px}.bar>i{display:block;height:100%;width:34%;background:linear-gradient(90deg,#a855f7,#60a5fa,#34d399);border-radius:inherit;animation:flow 1.1s ease-in-out infinite}@keyframes flow{0%{transform:translateX(-130%)}100%{transform:translateX(390%)}}.status{font:500 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a3a3a3}.err{color:#fca5a5}.links{display:none;gap:8px;justify-content:center;margin-top:18px}.links a{font-size:10px;color:#d4d4d4;text-decoration:none;border:1px solid #2d2d32;padding:8px 10px;border-radius:10px;background:#111113}
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">L</div>
        <div class="brand">LEAVES DESIGN</div>
        <div class="sub">RELEASE ROUTER</div>
        <div class="bar"><i></i></div>
        <div id="status" class="status">正在確認目前正式版本…</div>
        <div id="fallbackLinks" class="links"><a id="stableFallback" href="./releases/v27.9/?channel=stable">開啟 Stable</a><a id="sandboxFallback" href="./releases/v28.1/?channel=sandbox">開啟 Sandbox</a></div>
    </main>
<script>
(() => {
    'use strict';
    const DEFAULT_SUPABASE_URL = 'https://dadlmrmzupmmzthlvrmo.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoiZGFkbG1ybXp1cG1tenRobHZybW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODkzODc3NSwiZXhwIjoyMTA1NDUxNDc3fQ.t26i-uQEQnI_xwAKfVRsM5gg7EzJ_ux5K6cGhYLR-Zg';
    const FALLBACK = { stableVersion:'v27.9', sandboxVersion:'v28.1' };
    const status = document.getElementById('status');
    const links = document.getElementById('fallbackLinks');
    const stableFallback = document.getElementById('stableFallback');
    const sandboxFallback = document.getElementById('sandboxFallback');

    const safeVersion = (v, fallback) => /^v\d+\.\d+(?:\.\d+)?(?:[-._a-zA-Z0-9]+)?$/.test(String(v||'')) ? String(v) : fallback;
    const releasePath = (v) => `./releases/${encodeURIComponent(v)}/`;

    async function loadManifest(){
        const url = (localStorage.getItem('shiye_supabase_url') || DEFAULT_SUPABASE_URL).replace(/\/$/, '');
        const key = localStorage.getItem('shiye_supabase_key') || DEFAULT_SUPABASE_KEY;
        try {
            const res = await fetch(`${url}/rest/v1/app_config?id=eq.release_manifest&select=data,updated_at&_=${Date.now()}`, {
                cache:'no-store',
                headers:{ apikey:key, Authorization:`Bearer ${key}`, Accept:'application/json' }
            });
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const rows = await res.json();
            if(Array.isArray(rows) && rows[0]?.data) return { ...FALLBACK, ...rows[0].data };
        } catch(err) {
            console.warn('Release manifest unavailable; using safe fallback.', err);
        }
        return FALLBACK;
    }

    async function route(){
        const manifest = await loadManifest();
        const params = new URLSearchParams(location.search);
        const requestedChannel = params.get('channel') === 'sandbox' ? 'sandbox' : 'stable';
        const stableVersion = safeVersion(manifest.stableVersion, FALLBACK.stableVersion);
        const sandboxVersion = safeVersion(manifest.sandboxVersion, FALLBACK.sandboxVersion);
        stableFallback.href = `${releasePath(stableVersion)}?channel=stable`;
        sandboxFallback.href = `${releasePath(sandboxVersion)}?channel=sandbox`;
        const version = requestedChannel === 'sandbox' ? sandboxVersion : stableVersion;
        params.set('channel', requestedChannel);
        const restQuery = params.toString();
        const target = `${releasePath(version)}${restQuery ? `?${restQuery}` : ''}${location.hash || ''}`;
        status.textContent = requestedChannel === 'sandbox' ? `正在進入 Sandbox ${version}…` : `正在進入 Stable ${version}…`;
        location.replace(target);
    }

    const timer = setTimeout(() => { status.innerHTML = '<span class="err">版本入口回應較慢，您可手動選擇入口。</span>'; links.style.display='flex'; }, 4500);
    route().catch(err => { clearTimeout(timer); console.error(err); status.innerHTML='<span class="err">Release Router 發生錯誤，請使用手動入口。</span>'; links.style.display='flex'; });
})();
</script>
</body>
</html>
