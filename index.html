<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>LEAVES DESIGN · Release Router</title>
    <style>
        *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#050506;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden}
        body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(64,45,90,.18),transparent 35%),#050506}
        .card{width:min(420px,calc(100vw - 36px));padding:34px 30px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(12,12,15,.78);backdrop-filter:blur(24px);box-shadow:0 28px 70px rgba(0,0,0,.5);text-align:center}
        .mark{width:46px;height:46px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:#fff;color:#050506;font-weight:800}.brand{font-size:13px;letter-spacing:.22em}.sub{font-size:10px;color:#777;margin-top:8px;letter-spacing:.1em}.bar{height:3px;background:#17171a;border-radius:999px;overflow:hidden;margin:26px 0 14px}.bar>i{display:block;height:100%;width:34%;background:linear-gradient(90deg,#a855f7,#60a5fa,#34d399);border-radius:inherit;animation:flow 1.1s ease-in-out infinite}@keyframes flow{0%{transform:translateX(-130%)}100%{transform:translateX(390%)}}.status{font:500 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a3a3a3}.err{color:#fca5a5}.links{display:none;gap:8px;justify-content:center;margin-top:18px}.links a{font-size:10px;color:#d4d4d4;text-decoration:none;border:1px solid #2d2d32;padding:8px 10px;border-radius:10px;background:#111113}
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">L</div>
        <div class="brand">LEAVES DESIGN</div>
        <div class="sub">RELEASE ROUTER</div>
        <div class="bar"><i></i></div>
        <div id="status" class="status">正在確認目前正式版本…</div>
        <div id="fallbackLinks" class="links"><a id="stableFallback" href="./releases/v27.9/?channel=stable">開啟 Stable</a><a id="sandboxFallback" href="./releases/v28.1/?channel=sandbox">開啟 Sandbox</a></div>
    </main>
<script>
(() => {
    'use strict';
    const DEFAULT_SUPABASE_URL = 'https://dadlmrmzupmmzthlvrmo.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZGxtcm16dXBtbXp0aGx2cm1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Mzg3NzUsImV4cCI6MjEwNDUxNDc3NX0.t26i-uQEQnI_xwAKfVRsM5gg7EzJ_ux5K6cGhYLR-Zg';
    const FALLBACK = { stableVersion:'v27.9', sandboxVersion:'v28.1' };
    const status = document.getElementById('status');
    const links = document.getElementById('fallbackLinks');
    const stableFallback = document.getElementById('stableFallback');
    const sandboxFallback = document.getElementById('sandboxFallback');
    const ROUTE_GUARD_KEY = 'leaves:release-router:last-route';

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const safeVersion = (v, fallback = null) => /^v\d+\.\d+(?:\.\d+)?(?:[-._a-zA-Z0-9]+)?$/.test(String(v||'')) ? String(v) : fallback;
    const releasePath = (v) => `./releases/${encodeURIComponent(v)}/`;

    function getConnection() {
        return {
            url: (localStorage.getItem('shiye_supabase_url') || DEFAULT_SUPABASE_URL).replace(/\/$/, ''),
            key: localStorage.getItem('shiye_supabase_key') || DEFAULT_SUPABASE_KEY
        };
    }

    async function fetchConfigRow(id, timeoutMs = 4500) {
        const { url, key } = getConnection();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            // IMPORTANT: Do not append arbitrary cache-buster query params to PostgREST.
            // PostgREST interprets unknown query params as column filters and may return HTTP 400.
            const endpoint = `${url}/rest/v1/app_config?id=eq.${encodeURIComponent(id)}&select=data,updated_at`;
            const res = await fetch(endpoint, {
                method:'GET',
                cache:'no-store',
                signal:controller.signal,
                headers:{
                    apikey:key,
                    Authorization:`Bearer ${key}`,
                    Accept:'application/json',
                    'Cache-Control':'no-cache, no-store, max-age=0',
                    Pragma:'no-cache'
                }
            });
            if(!res.ok) {
                const body = await res.text().catch(() => '');
                throw new Error(`HTTP ${res.status}${body ? ` · ${body.slice(0,120)}` : ''}`);
            }
            const rows = await res.json();
            return Array.isArray(rows) && rows[0] ? rows[0] : null;
        } finally {
            clearTimeout(timer);
        }
    }

    async function loadManifestWithRetry() {
        const waits = [0, 250, 700, 1500];
        let lastError = null;
        for (const wait of waits) {
            if (wait) await sleep(wait);
            try {
                const row = await fetchConfigRow('release_manifest');
                if (!row?.data) throw new Error('release_manifest row is empty');
                return { manifest:{ ...FALLBACK, ...row.data }, error:null };
            } catch (err) {
                lastError = err;
                console.warn('Release manifest read attempt failed:', err);
            }
        }
        return { manifest:null, error:lastError };
    }

    async function loadDeploymentState() {
        try {
            const row = await fetchConfigRow('deployment_state', 3500);
            return row?.data || null;
        } catch (err) {
            console.warn('Deployment state unavailable:', err);
            return null;
        }
    }

    function setFallbackLinks(stableVersion, sandboxVersion) {
        stableFallback.href = `${releasePath(stableVersion)}?channel=stable`;
        sandboxFallback.href = `${releasePath(sandboxVersion)}?channel=sandbox`;
    }

    function stopWithManualChoice(message, stableVersion, sandboxVersion) {
        setFallbackLinks(stableVersion, sandboxVersion);
        status.innerHTML = `<span class="err">${message}</span>`;
        links.style.display = 'flex';
    }

    function recentlyRoutedTo(target) {
        try {
            const raw = sessionStorage.getItem(ROUTE_GUARD_KEY);
            if (!raw) return false;
            const info = JSON.parse(raw);
            return info?.target === target && (Date.now() - Number(info?.at || 0)) < 4500;
        } catch(_) { return false; }
    }

    function rememberRoute(target) {
        try { sessionStorage.setItem(ROUTE_GUARD_KEY, JSON.stringify({ target, at:Date.now() })); } catch(_) {}
    }

    async function route(){
        const params = new URLSearchParams(location.search);
        const requestedChannel = params.get('channel') === 'sandbox' ? 'sandbox' : 'stable';
        const releaseComplete = safeVersion(params.get('releaseComplete'));
        const fromVersion = safeVersion(params.get('fromVersion'));

        const { manifest, error:manifestError } = await loadManifestWithRetry();
        let stableVersion = safeVersion(manifest?.stableVersion, FALLBACK.stableVersion);
        let sandboxVersion = safeVersion(manifest?.sandboxVersion, FALLBACK.sandboxVersion);
        setFallbackLinks(stableVersion, sandboxVersion);

        // When a deployment has just completed, never silently fall back to an old hard-coded
        // stable version. If the manifest is temporarily unavailable, verify deployment_state
        // and prefer the completed target; otherwise stop instead of creating a redirect loop.
        if (requestedChannel === 'stable' && releaseComplete) {
            const deployment = await loadDeploymentState();
            const deploymentConfirmsTarget = !!(
                deployment &&
                ['success','rolled_back'].includes(String(deployment.status || '')) &&
                safeVersion(deployment.targetVersion) === releaseComplete &&
                Number(deployment.progress || 0) >= 100
            );
            if (deploymentConfirmsTarget && (!manifest || stableVersion !== releaseComplete)) {
                console.warn('Manifest not yet reflecting completed deployment; using verified deployment target once.', { stableVersion, releaseComplete });
                stableVersion = releaseComplete;
                setFallbackLinks(stableVersion, sandboxVersion);
            } else if (!manifest && !deploymentConfirmsTarget) {
                stopWithManualChoice(`版本資訊暫時無法確認，已停止自動跳轉以避免循環。${manifestError ? ' 請稍後重新整理。' : ''}`, FALLBACK.stableVersion, FALLBACK.sandboxVersion);
                return;
            }
        } else if (!manifest) {
            // Normal non-deployment entry: preserve availability with the known-safe fallback.
            console.warn('Release manifest unavailable; using safe fallback.', manifestError);
        }

        const version = requestedChannel === 'sandbox' ? sandboxVersion : stableVersion;

        // Hard loop breaker: if a release sent us here asking for a different target but the
        // router is about to send the browser straight back to that same source release, stop.
        if (requestedChannel === 'stable' && releaseComplete && fromVersion && fromVersion === version && releaseComplete !== version) {
            stopWithManualChoice(`版本切換尚未同步完成（目前 ${version}，目標 ${releaseComplete}）。已停止自動跳轉，避免畫面反覆重載。`, version, sandboxVersion);
            return;
        }

        // Transition-only params must NOT be forwarded to the release page.
        params.delete('releaseComplete');
        params.delete('fromVersion');
        params.delete('deploymentId');
        params.set('channel', requestedChannel);

        const restQuery = params.toString();
        const target = `${releasePath(version)}${restQuery ? `?${restQuery}` : ''}${location.hash || ''}`;
        if (recentlyRoutedTo(target)) {
            stopWithManualChoice(`偵測到重複版本導向，已暫停自動跳轉。請手動開啟目前 ${requestedChannel === 'sandbox' ? 'Sandbox' : 'Stable'}。`, stableVersion, sandboxVersion);
            return;
        }

        status.textContent = requestedChannel === 'sandbox' ? `正在進入 Sandbox ${version}…` : `正在進入 Stable ${version}…`;
        rememberRoute(target);
        location.replace(target);
    }

    const timer = setTimeout(() => {
        status.innerHTML = '<span class="err">版本入口回應較慢，您可手動選擇入口。</span>';
        links.style.display='flex';
    }, 6500);

    route().catch(err => {
        clearTimeout(timer);
        console.error(err);
        stopWithManualChoice('Release Router 發生錯誤，已停止自動跳轉以避免循環。', FALLBACK.stableVersion, FALLBACK.sandboxVersion);
    });
})();
</script>
</body>
</html>
