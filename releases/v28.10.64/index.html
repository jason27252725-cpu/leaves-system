<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>拾葉設計 AI 正式站</title>
  <style>body{background:#151515;color:#eee;font:18px/1.7 system-ui;padding:3rem}a{color:inherit}</style>
</head>
<body>
  <p id="status" role="status">正在讀取正式站目前的版本…</p>
  <a href="../../">開啟正式站固定入口</a>
<script>
(async function openPublishedWebsite() {
  const root = new URL('../../', location.href);
  const original = new URL('original-v28.10.64.html', location.href);
  function open(target) {
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  }
  const channel = new URL(location.href).searchParams.get('channel');
  if (channel && channel !== 'stable') return open(original);
  try {
    const probe = new URL('index.html', root);
    probe.searchParams.set('verify', Date.now());
    const response = await fetch(probe, {
      cache: 'no-store', credentials: 'omit', redirect: 'error',
      signal: AbortSignal.timeout(10000)
    });
    if (!response.ok) throw Error('entry unavailable');
    const bytes = await response.arrayBuffer();
    const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)),
      byte => byte.toString(16).padStart(2, '0')).join('');
    if (hash === 'f6786b775629fb62513b8c07844a11140f29c80bf37c76542fc56c4c5d5f151b') {
      return open(original);
    }
    const html = new TextDecoder().decode(bytes);
    const match = html.match(/<a href="(site-releases\/stable\/[a-z0-9][a-z0-9.-]{0,63}\/candidates\/core\/index\.html)">/);
    if (!match) throw Error('unrecognized entry');
    open(new URL(match[1], root));
  } catch {
    document.getElementById('status').textContent='目前無法核對正式站版本，請開啟下方固定入口。';
  }
})();
</script>
</body></html>
