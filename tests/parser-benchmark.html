<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LEAVES P1 · Parser Benchmark</title><style>body{font:14px/1.6 system-ui,sans-serif;background:#0b1418;color:#e4eee8;margin:auto;padding:35px;max-width:860px}section{padding:18px;border:1px solid #ffffff2d;border-radius:14px;margin:14px 0;background:#152024}button,select,input{font:inherit;padding:10px;border-radius:8px;background:#26383a;color:#eafff5;border:1px solid #ffffff22}button:disabled{opacity:.35}pre{white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto;background:#080e12;padding:14px;border-radius:12px}.notice{color:#ead4a6}</style></head><body><h1>LEAVES P1 · SKP Parser Benchmark</h1><p>在公司電腦瀏覽器本機進行測試，不會將 SKP 上傳到任何伺服器。<b>本工具不修改正式 Quantity 系統。</b></p><section><input type="file" id="file" accept=".skp"><select id="mode"><option value="wasm-safe">C++ / WASM 預覽路線</option><option value="full">TypeScript 完整路線（限小型測試）</option></select><button id="start">開始測試</button><button id="cancel" disabled>取消</button><button id="save" disabled>下載結果</button></section><section><p class="notice">P1 僅測速度、資料能力及完整性。WASM GLB 不含完整正式算量所需 metadata，因此就算 PASS，也只能標成 PREVIEW_ONLY。大檔不要自動回退 TypeScript 模式。</p><div id="status">等待檔案…</div><pre id="log"></pre></section><script type="module">
const el=id=>document.getElementById(id);let worker=null,result=null,job='';let startAt=0;const workerUrl=new URL('../modules/quantity/2.0.0-alpha.1/quantity.worker.js',location.href);
const output=(msg)=>{el('log').textContent+=msg+'\n';el('log').scrollTop=el('log').scrollHeight};
function end(){worker?.terminate();worker=null;el('cancel').disabled=true;el('start').disabled=false;}
el('start').onclick=()=>{const f=el('file').files[0];if(!f)return output('請選擇公司 SKP');const mode=el('mode').value;if(mode==='full'&&f.size>96*1048576)return output('TypeScript 大檔記憶體保護：超過 96MB，請改測 WASM。');job='bench-'+Date.now();startAt=performance.now();result={tool:'LEAVES P1 benchmark',fileName:f.name,sizeBytes:f.size,mode,startedAt:new Date().toISOString(),browser:navigator.userAgent,deviceMemoryGB:navigator.deviceMemory??'unavailable',cpuThreads:navigator.hardwareConcurrency??'unavailable',status:'RUNNING'};el('save').disabled=true;el('cancel').disabled=false;el('start').disabled=true;el('log').textContent='';output('開始測試：'+f.name);worker=new Worker(workerUrl,{type:'module'});worker.onmessage=e=>{const m=e.data||{};if(m.jobId!==job)return;if(m.type==='progress'){el('status').textContent=(m.phase||'')+'：'+(m.label||'');if(m.phase==='quantity'&&m.percent==null)return;output((m.phase||'')+' '+(m.percent==null?'進行中':m.percent+'%'));}if(m.type==='ready'){result={...result,status:m.mode==='wasm-safe'?'PREVIEW_ONLY':m.result?.integrityReport?.status||'UNVERIFIED',timeMs:Math.round(performance.now()-startAt),faceCount:m.wasm?.faceCount??m.result?.totals?.placedFaces??null,componentCount:m.wasm?.componentCount??m.result?.totals?.placements??null,materialCount:m.wasm?.materialCount??m.result?.sourceMaterialCount??null,integrityReport:m.result?.integrityReport??null,bytesGLB:m.glb?.byteLength??null,quantityValidated:false,notes:m.mode==='wasm-safe'?'GLB-only: no authoritative original Face/Loop/Tag metadata':'Needs independent Golden reference for quantities'};el('status').textContent=result.status;output('完成：'+result.status+' / '+result.timeMs+'ms');el('save').disabled=false;end();}if(m.type==='error'){result={...result,status:'FAIL',message:m.error?.message||String(m.error),timeMs:Math.round(performance.now()-startAt)};output('FAIL：'+result.message);el('save').disabled=false;end();}};worker.onerror=e=>{result={...result,status:'FAIL',message:e.message||'Worker error'};output(result.message);el('save').disabled=false;end()};worker.postMessage({type:'load',jobId:job,file:f,mode,options:{maxPlacedFaces:4000000}})};
el('cancel').onclick=()=>{result={...result,status:'CANCELLED'};job='';end();output('已取消：Worker 已終止，未採用任何算量資料');el('save').disabled=false};
el('save').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='LEAVES-P1-BENCHMARK.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
window.addEventListener('pagehide',()=>{job='';end()});
</script></body></html>
